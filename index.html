<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f1f4">
<title>シェイク・オイル</title>
<style>
  :root { --fg:#4a4148; --sub:#958a92; --panel:#ffffffb0; --bg1:#fdfbfc; --bg2:#f3e6ee; --glow1:#ffd6e6; --glow2:#d8dcff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent; }
  body { background:
      radial-gradient(60vmax 50vmax at 85% 25%, var(--glow1) 0%, transparent 60%),
      radial-gradient(50vmax 40vmax at 10% 85%, var(--glow2) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%); }
  #stage { position:fixed; inset:0; }
  #bottle { position:absolute; left:0; top:0; will-change:transform; }
  #bottle canvas { position:absolute; display:block; }
  #shadow { position:absolute; left:0; top:0; border-radius:50%;
    background:radial-gradient(closest-side, #0000002a, transparent); pointer-events:none; will-change:transform; }
  #hud { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:0; right:0; text-align:center; pointer-events:none; }
  #hud h1 { margin:0; font-size:14px; font-weight:500; letter-spacing:.25em; color:var(--sub); }
  #btns { position:fixed; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:10px; padding:0 16px; flex-wrap:wrap; }
  button { font:inherit; font-size:14px; padding:10px 16px; border-radius:999px; border:1px solid #ffffff;
    background:var(--panel); color:var(--fg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  button:focus-visible { outline:2px solid var(--sub); outline-offset:2px; }
  #sensor { display:none; align-items:center; gap:10px; }
  #sensor .track { width:38px; height:22px; border-radius:11px; background:#d9d0d6; position:relative; transition:background .2s; flex:none; }
  #sensor .knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px #0003; transition:transform .2s; }
  #sensor[aria-checked="true"] .track { background:#7d8cf0; }
  #sensor[aria-checked="true"] .knob { transform:translateX(16px); }
  #fps { position:fixed; left:8px; bottom:calc(2px + env(safe-area-inset-bottom)); font-size:10px; color:var(--sub); }
</style>
</head>
<body>
<div id="stage">
  <div id="shadow"></div>
  <div id="bottle"><canvas id="gl"></canvas><canvas id="glass"></canvas></div>
</div>
<div id="hud"><h1>シェイク・オイル</h1></div>
<div id="btns">
  <button id="color">色をかえる</button>
  <button id="flip">ひっくり返す</button>
  <button id="sensor" role="switch" aria-checked="false"><span>傾き・振りセンサー</span><span class="track"><span class="knob"></span></span></button>
</div>
<div id="fps"></div>
<script>
(() => {
  'use strict';
  // =========================================================
  // 容器の形(ワールド座標, 単位 = 論理px)。docs/reference-notes.md 参照
  // =========================================================
  const W = 200, H = 420;
  const WAIST = 16;                         // ゆるいくびれ
  const CAP = 46, SIDE = 11;                // 上下ブロックと側面の厚み
  const PLATE_Y = 30, PLATE_V = 20;         // 仕切り: 壁際の高さと斜面の深さ(たまる部屋は小さく、滴の通り道を広く)
  const HOLE = 11;                          // 中央の穴の半幅(液が通れるのはここだけ)
  function halfW(y) {
    const s = Math.sin(Math.PI * Math.min(1, Math.max(0, y / H)));
    return W / 2 - WAIST * s * s;
  }
  // 仕切り: 砂時計のくびれのような「くさび」。上から見るとV字、下から見ると山型で、
  // 落ちる液も昇る液も真ん中の穴に集まる。壁までぴったりつながっていて、すき間はない。上下対称
  const SEG = [];
  const PLATE_POLY = [];    // 描画用のくさびの形
  {
    const cx = W / 2, hw = halfW(PLATE_Y) + 2;   // 壁の中まで少し延ばして角のすき間をなくす
    for (const flip of [false, true]) {
      const f = y => flip ? H - y : y;
      for (const sx of [-1, 1]) {
        const wx = cx + sx * hw, hx = cx + sx * HOLE;
        SEG.push([wx, f(PLATE_Y), hx, f(PLATE_Y + PLATE_V)]);              // 上の斜面
        SEG.push([hx, f(PLATE_Y + PLATE_V), wx, f(PLATE_Y + PLATE_V * 2)]); // 下の斜面
        PLATE_POLY.push([[wx, f(PLATE_Y)], [hx, f(PLATE_Y + PLATE_V)], [wx, f(PLATE_Y + PLATE_V * 2)]]);
      }
    }
  }
  // ふた(色ごとに通す/通さないを切り替える見えない板)
  //   上の仕切りの穴: 青を一定間隔で1滴ずつ落とす(昇ってきたピンクはいつでも通る)
  //   下の仕切りの穴: ピンクを一定間隔で1滴ずつ昇らせる(落ちてきた青はいつでも通る)
  SEG.push([W / 2 - HOLE - 1, PLATE_Y + PLATE_V, W / 2 + HOLE + 1, PLATE_Y + PLATE_V]);
  SEG.push([W / 2 - HOLE - 1, H - PLATE_Y - PLATE_V, W / 2 + HOLE + 1, H - PLATE_Y - PLATE_V]);
  const NPLATE = 8, NS = SEG.length;
  const lidMask = new Uint8Array(2);   // ビット0=Aを止める ビット1=Bを止める
  const DRIP_PERIOD = 1.7, DRIP_OPEN = 0.55;   // 秒(青とピンクは半周期ずらして交互に)
  const SX = new Float32Array(NS), SY = new Float32Array(NS), SDX = new Float32Array(NS), SDY = new Float32Array(NS),
        SL2 = new Float32Array(NS), SNX = new Float32Array(NS), SNY = new Float32Array(NS);
  SEG.forEach(([x1, y1, x2, y2], i) => {
    SX[i] = x1; SY[i] = y1; SDX[i] = x2 - x1; SDY[i] = y2 - y1;
    SL2[i] = SDX[i] * SDX[i] + SDY[i] * SDY[i];
    const l = Math.sqrt(SL2[i]); SNX[i] = -SDY[i] / l; SNY[i] = SDX[i] / l;
  });

  // =========================================================
  // 色の組み合わせ(参考写真から)。A=手前の液体 / B=奥の液体
  // =========================================================
  const THEMES = [
    { A: [[.20,.42,.95],[.03,.09,.58]], B: [[.96,.40,.72],[.78,.10,.42]], css: ['#fdfbfc','#f3e6ee','#ffd6e6','#d8dcff'] },
    { A: [[.22,.80,.95],[.0,.42,.72]],  B: [[.92,.52,.90],[.70,.22,.68]], css: ['#fbfcfe','#e9eef6','#e4d6ff','#cdeffa'] },
    { A: [[.42,.80,.22],[.08,.48,.10]], B: [[.12,.62,.88],[.02,.30,.62]], css: ['#fbfdfb','#e6efea','#d6f2df','#d3e8f7'] },
    { A: [[.98,.28,.20],[.72,.05,.08]], B: [[1.,.84,.22],[.88,.56,.0]],   css: ['#fffcf8','#f6ebe0','#ffe0c9','#fff1c2'] },
  ];
  let theme = 0;

  // =========================================================
  // 物理(粒子法: double density relaxation)
  // 青は上の部屋から落ち、ピンクは下の部屋から昇る。どちらも真ん中の穴だけを通る。透明な液体は抵抗として扱う
  // =========================================================
  const R = 14, SP = 6.2, SUB = 2;
  const K = 0.24, KN = 0.45;                // 圧力・近距離圧力
  const ST = 0.03;                          // 表面張力(表面を縮めて丸い滴にする)
  const GRAV = [0.0095, -0.0095];          // A(青)は透明な液体より重くて沈む / B(ピンク)は軽くて昇る
  const DRAG = 0.972, VMAX = 6;   // 透明な液体の粘り気で、ゆっくり一定の速さで落ちる
  const MAXN = 1600;
  const X = new Float32Array(MAXN), Y = new Float32Array(MAXN);
  const PX = new Float32Array(MAXN), PY = new Float32Array(MAXN);
  const VX = new Float32Array(MAXN), VY = new Float32Array(MAXN);
  const ROOM = new Uint8Array(MAXN);       // いる場所 0=上の部屋 1=真ん中 2=下の部屋(漏れ防止に使う)
  const T = new Uint8Array(MAXN);           // 0=A(青・沈む) 1=B(ピンク・昇る)
  let N = 0, rho0 = 1;

  const GW = Math.ceil(W / R) + 1, GH = Math.ceil(H / R) + 1;
  const cellStart = new Int32Array(GW * GH + 1), cellOf = new Int32Array(MAXN), sorted = new Int32Array(MAXN);

  function plateTop(x) {            // 上の仕切りの上の斜面の高さ(下の仕切りの下の斜面は H - plateTop)
    const d = Math.abs(x - W / 2), hw = halfW(PLATE_Y) + 2;
    return d < HOLE ? PLATE_Y + PLATE_V : PLATE_Y + PLATE_V * (hw - d) / (hw - HOLE);
  }
  function roomOf(x, y) {            // くさびの真ん中の高さで分ける(穴以外ではくさびの中に入れない)
    return y < PLATE_Y + PLATE_V ? 0 : y > H - PLATE_Y - PLATE_V ? 2 : 1;
  }
  function init() {
    N = 0;
    // 青は上の部屋、ピンクは下の部屋に、それぞれ満タンに入れる(上下対称)
    const sp = SP * 0.9;   // 自重で少し縮むぶん、詰めて入れる
    for (const t of [0, 1]) {
      // 部屋は7割ほど: 落ちてきた滴が待たずに入れるよう、すき間を残す
      for (let yy = PLATE_Y + PLATE_V - 4, row = 0; yy > 16; yy -= sp * 0.866, row++) {
        const y = t ? H - yy : yy;
        const lim = halfW(y) - 3;
        for (let x = W / 2 - lim + (row & 1) * sp / 2; x <= W / 2 + lim; x += sp) {
          if (yy > plateTop(x) - 4 || N >= MAXN) continue;
          X[N] = PX[N] = x + (Math.random() - .5) * .3; Y[N] = PY[N] = y;
          VX[N] = VY[N] = 0; T[N] = t; N++;
        }
      }
    }
    for (let i = 0; i < N; i++) ROOM[i] = roomOf(X[i], Y[i]);
    // 静止密度(格子の内部の粒子で測る)
    let bi = 0; const cx = W / 2, cy = 40;
    for (let i = 0; i < N; i++) if (Math.hypot(X[i] - cx, Y[i] - cy) < Math.hypot(X[bi] - cx, Y[bi] - cy)) bi = i;
    let r = 0;
    for (let j = 0; j < N; j++) {
      if (j === bi) continue;
      const q = Math.hypot(X[j] - X[bi], Y[j] - Y[bi]) / R;
      if (q < 1) r += (1 - q) * (1 - q);
    }
    rho0 = r * 1.18;
    initBubbles();
  }

  function buildGrid() {
    cellStart.fill(0);
    for (let i = 0; i < N; i++) {
      let cx = (X[i] / R) | 0, cy = (Y[i] / R) | 0;
      if (cx < 0) cx = 0; else if (cx >= GW) cx = GW - 1;
      if (cy < 0) cy = 0; else if (cy >= GH) cy = GH - 1;
      const c = cy * GW + cx; cellOf[i] = c; cellStart[c + 1]++;
    }
    for (let c = 0; c < GW * GH; c++) cellStart[c + 1] += cellStart[c];
    const fillPos = cellStart.slice(0, GW * GH);
    for (let i = 0; i < N; i++) sorted[fillPos[cellOf[i]]++] = i;
  }

  let gbx = 0, gby = 1;     // 容器から見た重力の向き
  let ax = 0, ay = 0;       // 振ったときの慣性加速度
  const nbJ = new Int32Array(256), nbQ = new Float32Array(256);
  const R2 = R * R;

  const PM = 7;   // 仕切りの厚み(液体の見た目がはみ出さないよう少し厚め)
  function collidePlates(i) {
    const m = PM;
    for (let s = 0; s < NS; s++) {
      if (s >= NPLATE && !(lidMask[s - NPLATE] & (1 << T[i]))) continue;
      const x = X[i], y = Y[i];
      const s0 = (PX[i] - SX[s]) * SNX[s] + (PY[i] - SY[s]) * SNY[s];
      const s1 = (x - SX[s]) * SNX[s] + (y - SY[s]) * SNY[s];
      let t = ((x - SX[s]) * SDX[s] + (y - SY[s]) * SDY[s]) / SL2[s];
      if (t < 0) t = 0; else if (t > 1) t = 1;
      const qx = SX[s] + SDX[s] * t, qy = SY[s] + SDY[s] * t;
      const dx = x - qx, dy = y - qy, d2 = dx * dx + dy * dy;
      if (s0 * s1 < 0 && t > 0 && t < 1) {
        // 通り抜け防止: 前の位置の側へ戻す
        const side = s0 > 0 ? 1 : -1;
        X[i] = qx + SNX[s] * m * side; Y[i] = qy + SNY[s] * m * side;
      } else if (d2 < m * m) {
        const d = Math.sqrt(d2);
        let nx, ny;
        if (d < 1e-3) { const side = s0 >= 0 ? 1 : -1; nx = SNX[s] * side; ny = SNY[s] * side; }
        else { nx = dx / d; ny = dy / d; }
        X[i] = qx + nx * m; Y[i] = qy + ny * m;
      }
    }
  }

  // ノズルが開いている間、ノズルの入り口付近の液体に少し下向きの力を足す
  // (ぶら下がった滴の重さが液を引っぱる効果の代わり。少量でも最後まで落ちきる)
  const nozY = [-1, -1];   // 色ごとの、開いているノズルの入り口(なければ -1)
  function substep() {
    for (let i = 0; i < N; i++) {
      let g = GRAV[T[i]];
      const nz = nozY[T[i]];
      if (nz >= 0 && Math.abs(X[i] - W / 2) < HOLE + 6 && Math.abs(Y[i] - nz) < 18) g *= 4;
      const vx = (VX[i] + gbx * g + ax) * DRAG, vy = (VY[i] + gby * g + ay) * DRAG;
      PX[i] = X[i]; PY[i] = Y[i];
      X[i] += vx; Y[i] += vy;
    }
    buildGrid();
    for (let i = 0; i < N; i++) {
      const xi = X[i], yi = Y[i], ti = T[i];
      const c = cellOf[i], cx = c % GW, cy = (c / GW) | 0;
      let rho = 0, rhoN = 0, n = 0, ws = 0, wx = 0, wy = 0;
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        if (gy < 0 || gy >= GH) continue;
        for (let gx = cx - 1; gx <= cx + 1; gx++) {
          if (gx < 0 || gx >= GW) continue;
          const cc = gy * GW + gx;
          for (let k = cellStart[cc], e = cellStart[cc + 1]; k < e; k++) {
            const j = sorted[k];
            if (j === i) continue;
            const dx = X[j] - xi, dy = Y[j] - yi, d2 = dx * dx + dy * dy;
            if (d2 >= R2 || n >= 256) continue;
            // 青とピンクは奥行きが違うので、お互いに押し合わずにすれ違う(同じ色どうしだけ計算する)
            if (T[j] !== ti) continue;
            const q = Math.sqrt(d2) / R, a = 1 - q;
            rho += a * a; rhoN += a * a * a; ws += a; wx += a * X[j]; wy += a * Y[j];
            nbJ[n] = j; nbQ[n] = q; n++;
          }
        }
      }
      const pr = K * (rho - rho0), prN = KN * rhoN;
      let sx = 0, sy = 0;
      for (let m = 0; m < n; m++) {
        const j = nbJ[m], q = nbQ[m], a = 1 - q;
        let dx = X[j] - X[i], dy = Y[j] - Y[i];
        const d = Math.sqrt(dx * dx + dy * dy) || 1e-4;
        dx /= d; dy /= d;
        const D = (pr * a + prN * a * a) * 0.5;
        X[j] += dx * D; Y[j] += dy * D;
        sx -= dx * D; sy -= dy * D;
      }
      X[i] += sx; Y[i] += sy;
      // 周りの同じ色の重心へ少し寄せる: 表面が縮み、細い流れはくびれて滴に分かれる
      if (ws > 0) { X[i] += ST * (wx / ws - xi); Y[i] += ST * (wy / ws - yi); }
    }
    const m = 2.5;
    for (let i = 0; i < N; i++) {
      collidePlates(i);
      let x = X[i], y = Y[i];
      if (y < m) y = m; else if (y > H - m) y = H - m;
      const lim = halfW(y) - m;
      if (x < W / 2 - lim) x = W / 2 - lim; else if (x > W / 2 + lim) x = W / 2 + lim;
      // 漏れ防止: 真ん中の穴以外で別の場所へ移っていたら、このステップの動きを取り消す
      const r = roomOf(x, y);
      if (r !== ROOM[i]) {
        if (Math.abs(x - W / 2) < HOLE + 2 && Math.abs(PX[i] - W / 2) < HOLE + 2) ROOM[i] = r;
        else { x = PX[i]; y = PY[i]; }
      }
      X[i] = x; Y[i] = y;
      let vx = x - PX[i], vy = y - PY[i];
      const v2 = vx * vx + vy * vy;
      if (v2 > VMAX * VMAX) { const s = VMAX / Math.sqrt(v2); vx *= s; vy *= s; }
      VX[i] = vx; VY[i] = vy;
    }
  }

  // 透明な液体の中の小さな泡(見た目だけ)
  const NB = 10, BX = new Float32Array(NB), BY = new Float32Array(NB), BV = new Float32Array(NB),
        BS = new Float32Array(NB), BP = new Float32Array(NB);
  const BLO = PLATE_Y + PLATE_V * 2 + 8, BHI = H - PLATE_Y - PLATE_V * 2 - 8;
  function initBubbles() {
    for (let i = 0; i < NB; i++) { BX[i] = 20 + Math.random() * (W - 40); BY[i] = BLO + Math.random() * (BHI - BLO);
      BV[i] = 0.05 + Math.random() * 0.08; BS[i] = 0.2 + Math.random() * 0.25; BP[i] = Math.random() * 6.28; }
  }
  let bt = 0;
  function moveBubbles() {
    bt += 1 / 60;
    for (let i = 0; i < NB; i++) {
      BY[i] += -gby * BV[i] + ay * SUB * 0.3; BX[i] += -gbx * BV[i] + Math.sin(bt * 0.8 + BP[i]) * 0.1 + ax * SUB * 0.3;
      if (BY[i] < BLO) BY[i] = BHI; else if (BY[i] > BHI) BY[i] = BLO;
      const lim = halfW(BY[i]) - 5;
      if (BX[i] < W / 2 - lim) BX[i] = W / 2 - lim; else if (BX[i] > W / 2 + lim) BX[i] = W / 2 + lim;
    }
  }

  // =========================================================
  // 描画(WebGL)
  //   1) 粒子をぼかした点として「濃度テクスチャ」に加算 (A=R, B=G, 泡=B)
  //   2) 濃度をしきい値で切って液体の形を作り、色・縁の線・ツヤを付ける
  // =========================================================
  const glCv = document.getElementById('gl');
  const gl = glCv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }

  const splatP = prog(`
    attribute vec3 a; uniform vec2 uSize; uniform float uPt; varying float vT;
    void main(){ vT = a.z; gl_Position = vec4(a.x/uSize.x*2.-1., 1.-a.y/uSize.y*2., 0., 1.); gl_PointSize = uPt; }`,
  `precision mediump float; varying float vT;
    void main(){ vec2 p = gl_PointCoord*2.-1.; float r2 = dot(p,p); if(r2>1.) discard;
      float v = 1.-r2; v = v*v*v*0.58;
      gl_FragColor = vT < .5 ? vec4(v,0.,0.,0.) : vT < 1.5 ? vec4(0.,v,0.,0.) : vec4(0.,0.,v*1.9,0.); }`);

  const compP = prog(`
    attribute vec2 a; varying vec2 vUv;
    void main(){ vUv = a*.5+.5; gl_Position = vec4(a,0.,1.); }`,
  `precision mediump float;
    varying vec2 vUv; uniform sampler2D uF; uniform vec2 uTx; uniform vec2 uSize; uniform float uWaist;
    uniform vec3 uA0, uA1, uB0, uB1;   // 各色の 明るい色 / 濃い色
    float halfW(float y){ float s = sin(3.14159265*clamp(y/uSize.y,0.,1.)); return uSize.x*.5 - uWaist*s*s; }
    void main(){
      vec2 w = vec2(vUv.x*uSize.x, (1.-vUv.y)*uSize.y);
      if(halfW(w.y) - abs(w.x-uSize.x*.5) < 0.) discard;
      vec4 c = texture2D(uF, vUv);
      const float TH = .5;
      float ab = smoothstep(TH-.05, TH+.05, c.r);
      float ap = smoothstep(TH-.05, TH+.05, c.g);
      float ao = smoothstep(.42, .58, c.b);
      if(max(max(ab, ap), ao) < .003) discard;
      vec4 tl = texture2D(uF, vUv-vec2(uTx.x,0.)), tr = texture2D(uF, vUv+vec2(uTx.x,0.));
      vec4 td = texture2D(uF, vUv-vec2(0.,uTx.y)), tu = texture2D(uF, vUv+vec2(0.,uTx.y));
      vec3 na = normalize(vec3((tl.r-tr.r)*2.4, (td.r-tu.r)*2.4, 1.));
      vec3 nb = normalize(vec3((tl.g-tr.g)*2.4, (td.g-tu.g)*2.4, 1.));
      vec3 no = normalize(vec3((tl.b-tr.b)*1.5, (td.b-tu.b)*1.5, 1.));
      // 縁の細い線(しきい値のすぐ内側)と、縁に向かってわずかに濃くなるグラデーション
      float la = ab * (1. - smoothstep(TH+.03, TH+.16, c.r));
      float lb = ap * (1. - smoothstep(TH+.03, TH+.16, c.g));
      float ea = clamp(.18 + (1.-na.z)*1.1 + la*.7, 0., 1.);
      float eb = clamp(.18 + (1.-nb.z)*1.1 + lb*.7, 0., 1.);
      vec3 colA = mix(uA0, uA1, ea), colB = mix(uB0, uB1, eb);
      // 奥がB、手前がA。重なるとAを通してBが沈んで濃い色になる
      vec3 col = mix(vec3(1.), colB, ap*.9);
      col = mix(col, colA * mix(vec3(1.), col, .4), ab*.9);
      col *= mix(1., .7, ab*ap);
      // 光の当たる側の縁に小さなツヤ
      vec3 L = normalize(vec3(-.55,.6,.58)), Hh = normalize(L+vec3(0.,0.,1.));
      float sa = pow(max(dot(na,Hh),0.), 70.)*ab, sb = pow(max(dot(nb,Hh),0.), 70.)*ap;
      float bubbleRim = ao * smoothstep(.0, .5, 1.-no.z);
      float bubbleSpec = ao * pow(max(dot(no,Hh),0.), 30.);
      col = mix(col, vec3(1.), bubbleRim*.55) + bubbleSpec + (sa+sb)*.8;
      float alpha = max(max(ab*mix(.78,.95,ea), ap*mix(.74,.93,eb)), ao*(.15 + .6*bubbleRim + bubbleSpec));
      alpha = clamp(alpha + (sa+sb)*.5, 0., 1.);
      gl_FragColor = vec4(min(col, vec3(1.))*alpha, alpha);
    }`);

  const pBuf = gl.createBuffer(), qBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pData = new Float32Array((MAXN + NB) * 3);
  gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);
  gl.bufferData(gl.ARRAY_BUFFER, pData.byteLength, gl.DYNAMIC_DRAW);

  let fTex = null, fFbo = null, fW = 1, fH = 1;
  function makeField(w, h) {
    if (fTex) { gl.deleteTexture(fTex); gl.deleteFramebuffer(fFbo); }
    fW = w; fH = h;
    fTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fTex, 0);
  }

  const uS = { size: gl.getUniformLocation(splatP, 'uSize'), pt: gl.getUniformLocation(splatP, 'uPt') };
  const uC = {}; for (const n of ['uF','uTx','uSize','uWaist','uA0','uA1','uB0','uB1']) uC[n] = gl.getUniformLocation(compP, n);
  const aS = gl.getAttribLocation(splatP, 'a'), aC = gl.getAttribLocation(compP, 'a');

  function render() {
    for (let i = 0; i < N; i++) { pData[i*3] = X[i]; pData[i*3+1] = Y[i]; pData[i*3+2] = T[i]; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fFbo);
    gl.viewport(0, 0, fW, fH);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(splatP);
    gl.uniform2f(uS.size, W, H);
    gl.uniform1f(uS.pt, R * 2.0 * fW / W);
    gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pData.subarray(0, N * 3));
    gl.enableVertexAttribArray(aS);
    gl.vertexAttribPointer(aS, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, N);
    for (let i = 0; i < NB; i++) { pData[i*3] = BX[i]; pData[i*3+1] = BY[i]; pData[i*3+2] = 2; }
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pData.subarray(0, NB * 3));
    for (let i = 0; i < NB; i++) { gl.uniform1f(uS.pt, R * 2.0 * BS[i] * fW / W); gl.drawArrays(gl.POINTS, i, 1); }
    gl.disableVertexAttribArray(aS);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, glCv.width, glCv.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(compP);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fTex);
    gl.uniform1i(uC.uF, 0);
    gl.uniform2f(uC.uTx, 1.5 / fW, 1.5 / fH);
    gl.uniform2f(uC.uSize, W, H);
    gl.uniform1f(uC.uWaist, WAIST);
    const th = THEMES[theme];
    gl.uniform3fv(uC.uA0, th.A[0]); gl.uniform3fv(uC.uA1, th.A[1]);
    gl.uniform3fv(uC.uB0, th.B[0]); gl.uniform3fv(uC.uB1, th.B[1]);
    gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
    gl.enableVertexAttribArray(aC);
    gl.vertexAttribPointer(aC, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(aC);
  }

  // =========================================================
  // アクリルの容器と仕切り(静止画として描き、CSSで動かす)
  // =========================================================
  const glassCv = document.getElementById('glass'), gx2 = glassCv.getContext('2d');
  const bottleEl = document.getElementById('bottle'), shadowEl = document.getElementById('shadow');
  const rgb = (c, a) => `rgba(${c.map(v => Math.round(v * 255)).join(',')},${a})`;
  function drawGlass(scale, dpr) {
    const ow = W + SIDE * 2, oh = H + CAP * 2;
    glassCv.width = Math.round(ow * scale * dpr); glassCv.height = Math.round(oh * scale * dpr);
    glassCv.style.width = ow * scale + 'px'; glassCv.style.height = oh * scale + 'px';
    glassCv.style.left = '0px'; glassCv.style.top = '0px';
    const c = gx2, th = THEMES[theme];
    c.setTransform(scale * dpr, 0, 0, scale * dpr, SIDE * scale * dpr, CAP * scale * dpr);
    c.clearRect(-SIDE, -CAP, ow, oh);
    const steps = 48;
    const outer = new Path2D();
    outer.moveTo(W / 2 - halfW(0) - SIDE + 6, -CAP);
    for (let i = 0; i <= steps; i++) { const y = H * i / steps; outer.lineTo(W / 2 - halfW(y) - SIDE, y); }
    outer.lineTo(W / 2 - halfW(H) - SIDE + 6, H + CAP);
    outer.lineTo(W / 2 + halfW(H) + SIDE - 6, H + CAP);
    for (let i = steps; i >= 0; i--) { const y = H * i / steps; outer.lineTo(W / 2 + halfW(y) + SIDE, y); }
    outer.lineTo(W / 2 + halfW(0) + SIDE - 6, -CAP);
    outer.closePath();
    const inner = new Path2D();
    for (let i = 0; i <= steps; i++) { const y = H * i / steps; inner[i ? 'lineTo' : 'moveTo'](W / 2 - halfW(y), y); }
    for (let i = steps; i >= 0; i--) { const y = H * i / steps; inner.lineTo(W / 2 + halfW(y), y); }
    inner.closePath();

    // アクリルの厚み(中身は完全にくり抜く)
    c.save();
    c.fillStyle = 'rgba(255,255,255,0.32)'; c.fill(outer);
    c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000'; c.fill(inner);
    c.restore();
    // 上下ブロックに中の液体の色が映り込む
    const block = (y0, y1, colorAtEnd, col) => {
      const g = c.createLinearGradient(0, colorAtEnd ? y1 : y0, 0, colorAtEnd ? y0 : y1);
      g.addColorStop(0, rgb(col, 0.38)); g.addColorStop(0.5, 'rgba(255,255,255,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0.7)');
      c.fillStyle = g; c.fillRect(-SIDE + 5, y0 + 1, W + SIDE * 2 - 10, y1 - y0 - 2);
    };
    block(-CAP, 0, true, th.A[0]);
    block(H, H + CAP, false, th.B[0]);
    // 仕切り板
    c.lineCap = 'round';
    c.lineJoin = 'round';
    for (const poly of PLATE_POLY) {
      c.beginPath(); poly.forEach(([x, y], k) => k ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath();
      c.fillStyle = 'rgba(255,255,255,0.6)'; c.fill();
      c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 3; c.stroke();
      c.strokeStyle = 'rgba(130,110,135,0.45)'; c.lineWidth = 1; c.stroke();
    }
    // 輪郭とハイライト
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 2.2; c.stroke(outer);
    c.strokeStyle = 'rgba(150,130,150,0.3)'; c.lineWidth = 1; c.stroke(inner);
    c.beginPath(); c.moveTo(W / 2 - halfW(0), 0); c.lineTo(W / 2 + halfW(0), 0);
    c.moveTo(W / 2 - halfW(H), H); c.lineTo(W / 2 + halfW(H), H);
    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 1.5; c.stroke();
    const side = (off, wdt, alpha, y0, y1, right) => {
      c.beginPath();
      for (let i = 0; i <= 24; i++) { const y = y0 + (y1 - y0) * i / 24;
        const x = right ? W / 2 + halfW(y) + off : W / 2 - halfW(y) + off; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.strokeStyle = `rgba(255,255,255,${alpha})`; c.lineWidth = wdt; c.stroke();
    };
    side(-6, 4, 0.8, -CAP + 10, H + CAP - 10, false);
    side(5, 1.5, 0.45, 20, H - 20, false);
    side(5, 3, 0.5, -CAP + 14, H + CAP - 14, true);
    c.fillStyle = 'rgba(255,255,255,0.85)';
    c.beginPath(); c.roundRect(-SIDE + 12, -CAP + 7, W * 0.55, 4, 2); c.fill();
    c.beginPath(); c.roundRect(-SIDE + 12, H + CAP - 11, W * 0.4, 3, 2); c.fill();
  }

  // =========================================================
  // レイアウトと入力
  // =========================================================
  let vw = 0, vh = 0, scale = 1, dpr = 1, homeX = 0, homeY = 0;
  let bx = 0, by = 0, bvx = 0, bvy = 0, tx = 0, ty = 0, dragging = false, grabX = 0, grabY = 0;
  let ang = 0, angT = 0, angV = 0;          // 容器の回転(ひっくり返す)
  const OW = W + SIDE * 2, OH = H + CAP * 2;
  function resize() {
    vw = innerWidth; vh = innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    scale = Math.min((vh - 150) / OH, (vw * 0.7) / OW);
    homeX = (vw - OW * scale) / 2; homeY = 44 + (vh - 150 - OH * scale) / 2 + 12;
    if (!dragging) { bx = tx = homeX; by = ty = homeY; }
    bottleEl.style.width = OW * scale + 'px'; bottleEl.style.height = OH * scale + 'px';
    bottleEl.style.transformOrigin = `${OW * scale / 2}px ${OH * scale / 2}px`;
    glCv.style.left = SIDE * scale + 'px'; glCv.style.top = CAP * scale + 'px';
    glCv.style.width = W * scale + 'px'; glCv.style.height = H * scale + 'px';
    glCv.width = Math.round(W * scale * dpr); glCv.height = Math.round(H * scale * dpr);
    makeField(Math.round(glCv.width / 2), Math.round(glCv.height / 2));
    shadowEl.style.width = OW * scale * 1.3 + 'px'; shadowEl.style.height = 26 * scale + 'px';
    drawGlass(scale, dpr);
  }
  addEventListener('resize', resize);

  const stage = document.getElementById('stage');
  let lastTap = 0;
  stage.addEventListener('pointerdown', e => {
    dragging = true; stage.setPointerCapture(e.pointerId);
    grabX = bx - e.clientX; grabY = by - e.clientY; tx = bx; ty = by;
    const now = performance.now();
    if (now - lastTap < 300) flip();   // ダブルタップでもひっくり返す
    lastTap = now;
  });
  stage.addEventListener('pointermove', e => { if (dragging) { tx = e.clientX + grabX; ty = e.clientY + grabY; } });
  const up = () => { dragging = false; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);

  function flip() { angT += Math.PI; }
  document.getElementById('flip').addEventListener('click', flip);
  document.getElementById('color').addEventListener('click', () => {
    theme = (theme + 1) % THEMES.length;
    const [b1, b2, g1, g2] = THEMES[theme].css, st = document.documentElement.style;
    st.setProperty('--bg1', b1); st.setProperty('--bg2', b2); st.setProperty('--glow1', g1); st.setProperty('--glow2', g2);
    drawGlass(scale, dpr);
  });

  // モーションセンサー(iPhoneはボタンを押して許可が必要)
  const sBtn = document.getElementById('sensor');
  let sax = 0, say = 0, gsx = 0, gsy = 1, sensorOn = false;
  if ('DeviceMotionEvent' in window && matchMedia('(pointer: coarse)').matches) sBtn.style.display = 'inline-flex';
  function onMotion(e) {
    const a = e.acceleration, g = e.accelerationIncludingGravity;
    if (a && a.x != null) { sax = a.x; say = -a.y; }
    if (g && g.x != null) {          // 端末の傾き = 重力の向き
      const x = -(g.x - (a ? a.x : 0)), y = (g.y - (a ? a.y : 0));
      const l = Math.hypot(x, y);
      if (l > 2) { gsx += (x / l - gsx) * 0.2; gsy += (-y / l - gsy) * 0.2; }
    }
  }
  function setSensor(on) {
    sensorOn = on;
    sBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    if (on) addEventListener('devicemotion', onMotion);
    else {
      removeEventListener('devicemotion', onMotion);
      sax = say = 0; gsx = 0; gsy = 1;   // 重力をまっすぐ下に戻す
    }
  }
  // タップするたびに ON / OFF を切り替える(iPhoneは最初の ON のときだけ許可を聞かれる)
  sBtn.addEventListener('click', async () => {
    if (sensorOn) { setSensor(false); return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function' &&
          (await DeviceMotionEvent.requestPermission()) !== 'granted') return;
      setSensor(true);
    } catch (_) {}
  });

  // =========================================================
  // メインループ(物理は60Hz固定、描画は端末のリフレッシュレート)
  // =========================================================
  const fpsEl = document.getElementById('fps');
  const DROP_N = 12, dropDone = [false, false];
  let dripT = 0, last = performance.now(), acc = 0, pvx = 0, pvy = 0, fpsT = 0, fpsN = 0, simMs = 0;
  function tick() {
    if (!dragging) { tx = homeX; ty = homeY; }
    const k = dragging ? 0.55 : 0.12;
    bvx = (tx - bx) * k; bvy = (ty - by) * k;
    bx += bvx; by += bvy;
    // 回転はばねでゆっくり
    angV += (angT - ang) * 0.012; angV *= 0.86; ang += angV;
    const co = Math.cos(ang), si = Math.sin(ang);
    // 画面の向き → 容器の向き
    gbx = gsx * co + gsy * si; gby = -gsx * si + gsy * co;
    const sx = (bvx - pvx) / scale + sax * 0.3, sy = (bvy - pvy) / scale + say * 0.3;
    let fx = sx * co + sy * si, fy = -sx * si + sy * co;
    pvx = bvx; pvy = bvy;
    const lim = 16;
    fx = Math.max(-lim, Math.min(lim, fx)); fy = Math.max(-lim, Math.min(lim, fy));
    ax = -fx * 0.5 / SUB; ay = -fy * 0.5 / SUB;
    // 青は上の仕切りの穴から、ピンクは下の仕切りの穴から、半拍ずらして1滴ずつ出す
    dripT += 1 / 60;
    const f = gby > 0.3 ? 0 : gby < -0.3 ? 1 : -1;   // いま上側にある仕切り(0=容器の上側 1=下側)
    const phaseA = dripT % DRIP_PERIOD, phaseB = (dripT + DRIP_PERIOD / 2) % DRIP_PERIOD;
    if (phaseA < 1 / 60) dropDone[0] = false;
    if (phaseB < 1 / 60) dropDone[1] = false;
    if (f < 0) { lidMask.fill(3); nozY[0] = nozY[1] = -1; }   // 回転の途中は全部閉じる
    else {
      const gs = f ? -1 : 1;                                     // 容器から見た「下」の向き
      const yU = f ? H - PLATE_Y - PLATE_V : PLATE_Y + PLATE_V;  // 上側の仕切りの穴
      const yL = f ? PLATE_Y + PLATE_V : H - PLATE_Y - PLATE_V;  // 下側の仕切りの穴
      // 1回に出すのは滴ひとつ分まで: 穴の出口側にたまった量が DROP_N を超えたら、その回はもう閉じる
      let cA = 0, cB = 0;
      for (let i = 0; i < N; i++) {
        if (Math.abs(X[i] - W / 2) > HOLE + 14) continue;
        if (T[i] === 0) { const d = (Y[i] - yU) * gs; if (d > 0 && d < 30) cA++; }
        else { const d = (yL - Y[i]) * gs; if (d > 0 && d < 30) cB++; }
      }
      if (cA >= DROP_N) dropDone[0] = true;
      if (cB >= DROP_N) dropDone[1] = true;
      const openA = phaseA < DRIP_OPEN && !dropDone[0];
      const openB = phaseB < DRIP_OPEN && !dropDone[1];
      lidMask[f] = openA ? 0 : 1;        // 上側の穴: 青は番のときだけ / ピンクはいつでも上へ
      lidMask[1 - f] = openB ? 0 : 2;    // 下側の穴: ピンクは番のときだけ / 青はいつでも下へ
      nozY[0] = openA ? yU - 8 * gs : -1;
      nozY[1] = openB ? yL + 8 * gs : -1;
    }
    for (let s = 0; s < SUB; s++) substep();
    moveBubbles();
  }
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    acc += dt;
    const t0 = performance.now();
    let n = 0;
    while (acc >= 1 / 60 && n < 3) { tick(); acc -= 1 / 60; n++; }
    if (n === 3) acc = 0;
    simMs = simMs * 0.9 + (performance.now() - t0) * 0.1;
    const tilt = Math.max(-0.2, Math.min(0.2, bvx * 0.008));
    bottleEl.style.transform = `translate3d(${bx}px,${by}px,0) rotate(${ang + tilt}rad)`;
    shadowEl.style.transform = `translate3d(${bx - OW * scale * 0.15}px,${homeY + OH * scale - 10 * scale}px,0)`;
    render();
    fpsN++; fpsT += dt;
    if (fpsT > 1) { fpsEl.textContent = `${Math.round(fpsN / fpsT)}fps · 物理 ${simMs.toFixed(1)}ms · ${N}粒`; fpsN = 0; fpsT = 0; }
    requestAnimationFrame(loop);
  }

  resize(); init();
  window.__shake = { N: () => N, X, Y, T, ROOM, roomOf, tick, flip };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
