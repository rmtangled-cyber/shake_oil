<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f1f4">
<title>シェイク・オイル</title>
<style>
  :root { --top-safe:max(58px, calc(env(safe-area-inset-top) + 12px));   /* 上の端から離す量(ブラウザの上の帯に隠れないように) */
    --fg:#4a4148; --sub:#958a92; --panel:#ffffffb0; --bg1:#fdfbfc; --bg2:#f3e6ee; --glow1:#ffd6e6; --glow2:#d8dcff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent; }
  body { background:
      radial-gradient(60vmax 50vmax at 85% 25%, var(--glow1) 0%, transparent 60%),
      radial-gradient(50vmax 40vmax at 10% 85%, var(--glow2) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%); }
  /* 季節の背景の絵(切り替えるとふわっと入れ替わる) */
  .bgimg { position:fixed; inset:0; background:center / cover no-repeat; opacity:0; transition:opacity .6s ease; pointer-events:none; }
  .bgimg.on { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .bgimg { transition:none; } }
  #stage { position:fixed; inset:0; }
  #bottle { position:absolute; left:0; top:0; will-change:transform; }
  #bottle canvas { position:absolute; display:block; }
  #deco, #wheel { transition:opacity .35s ease; pointer-events:none; }
  #deco.off, #wheel.off { opacity:0; }
  #shadow { position:absolute; left:0; top:0; border-radius:50%;
    background:radial-gradient(closest-side, #0000002a, transparent); pointer-events:none; will-change:transform; }
  button { font:inherit; font-size:15px; color:var(--fg); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--sub); outline-offset:2px; }
  /* 画面の角に置く丸いボタン(左下=メニュー、右下=上下入れ替え、右上=季節) */
  .fab { position:fixed; z-index:20; width:46px; height:46px; padding:0; border-radius:50%;
    border:1px solid #ffffffcc; background:#ffffff8c; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow:0 2px 10px #0000000d; display:flex; align-items:center; justify-content:center; }
  .fab:active { transform:scale(.94); }
  #menuBtn { left:calc(14px + env(safe-area-inset-left)); bottom:calc(14px + env(safe-area-inset-bottom));
    flex-direction:column; gap:5px; }
  #menuBtn span { display:block; width:18px; height:2px; border-radius:1px; background:var(--sub);
    transition:transform .25s, opacity .25s; }
  #menuBtn[aria-expanded="true"] span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  #menuBtn[aria-expanded="true"] span:nth-child(2) { opacity:0; }
  #menuBtn[aria-expanded="true"] span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
  /* 右下に縦に並ぶボタン(上から ∞ / センサー / 回転) */
  #rightStack { position:fixed; z-index:20; right:calc(14px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:12px; }
  #rightStack .fab { position:static; }
  #infBtn svg, #sensorBtn svg { width:26px; height:26px; stroke:var(--sub); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #infBtn[aria-pressed="true"], #sensorBtn[aria-checked="true"] { background:#ffffffe6; border-color:var(--sub); box-shadow:0 0 0 2px #ffffff99, 0 2px 10px #00000014; }
  #infBtn[aria-pressed="true"] svg, #sensorBtn[aria-checked="true"] svg { stroke:var(--fg); }
  #sensorBtn { display:none; }
  #rotateBtn svg { width:24px; height:24px; stroke:var(--sub); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
    transition:transform .5s ease; }
  /* ブラウザで開くと、画面のいちばん上(時計などの帯)の下にページが入りこむことがあり、
     しかもその高さが env(safe-area-inset-top) で分からないことがある。上の端からは十分に離して置く */
  #seasons { position:fixed; z-index:20; top:var(--top-safe); right:calc(14px + env(safe-area-inset-right));
    display:flex; flex-direction:column; gap:10px; }
  #seasons .fab { position:static; width:42px; height:42px; opacity:.8; }
  #seasons .fab img { width:30px; height:30px; display:block; pointer-events:none; }
  #seasons .fab[aria-checked="true"] { opacity:1; background:#ffffffdd; border-color:var(--sub); box-shadow:0 0 0 2px #ffffff99, 0 2px 10px #00000014; }
  /* メニュー(左下のボタンの上に開く) */
  #scrim { position:fixed; inset:0; z-index:10; background:#0000; transition:background .25s; }
  #scrim.open { background:#00000014; }
  #menu { position:fixed; z-index:15; left:calc(14px + env(safe-area-inset-left)); bottom:calc(72px + env(safe-area-inset-bottom));
    width:min(270px, calc(100vw - 28px)); padding:12px;
    background:#ffffffd0; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-radius:18px; box-shadow:0 6px 28px #00000014;
    display:flex; flex-direction:column; gap:8px; transform-origin:left bottom;
    opacity:0; transform:translateY(8px) scale(.96); pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  #menu.open { opacity:1; transform:none; pointer-events:auto; }
  .mitem { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:12px 14px; border-radius:12px; border:1px solid #0000000d; background:#ffffffa8; text-align:left; }
  .mitem .soon { font-size:11px; color:var(--sub); border:1px solid #0000001a; border-radius:999px; padding:2px 8px; }
  .mlbl { font-size:11px; letter-spacing:.14em; color:var(--sub); padding:2px 4px 0; }
  .mitem[aria-checked="true"] { border-color:var(--sub); background:#fff; }
  .mitem .tm { font-size:12px; color:var(--sub); }
  [data-mode][aria-disabled="true"] { cursor:default; color:var(--sub); }
  /* タイマーモードの時間ボタン(右下) */
  #timeBtns { display:flex; flex-direction:column; gap:12px; }
  #timeBtns[hidden] { display:none; }
  #timeBtns .fab { flex-direction:column; gap:0; color:var(--sub); font-variant-numeric:tabular-nums; }
  #timeBtns .fab b { font-size:17px; font-weight:600; line-height:1; }
  #timeBtns .fab small { font-size:9px; line-height:1.2; letter-spacing:.05em; }
  #timeBtns .fab[aria-checked="true"] { color:var(--fg); background:#ffffffe6; border-color:var(--sub); box-shadow:0 0 0 2px #ffffff99, 0 2px 10px #00000014; }
  @media (prefers-reduced-motion: reduce) { #menu, #scrim, #menuBtn span, #rotateBtn svg { transition:none; } }
  #fps { position:fixed; left:0; right:0; text-align:center; bottom:calc(30px + env(safe-area-inset-bottom)); font-size:10px; color:var(--sub); opacity:.8; pointer-events:none; }
</style>
</head>
<body>
<div class="bgimg" style="background-image:url(bg/spring.jpg)"></div>
<div class="bgimg" style="background-image:url(bg/summer.jpg)"></div>
<div class="bgimg" style="background-image:url(bg/autumn.jpg)"></div>
<div class="bgimg" style="background-image:url(bg/winter.jpg)"></div>
<div id="stage">
  <div id="shadow"></div>
  <div id="bottle"><canvas id="gl"></canvas><canvas id="deco"></canvas><canvas id="wheel"></canvas><canvas id="glass"></canvas></div>
</div>
<div id="seasons" role="radiogroup" aria-label="季節"></div>
<div id="rightStack">
  <div id="timeBtns" role="radiogroup" aria-label="タイマーの時間" hidden></div>
  <button id="infBtn" class="fab" aria-label="ずっと落ち続ける" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c-2-2.6-3.6-4-5.5-4a4 4 0 0 0 0 8c1.9 0 3.5-1.4 5.5-4s3.6-4 5.5-4a4 4 0 0 1 0 8c-1.9 0-3.5-1.4-5.5-4z"/></svg>
</button>
  <button id="sensorBtn" class="fab" role="switch" aria-checked="false" aria-label="傾き・振りセンサー">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3.5" width="8" height="15" rx="1.8" transform="rotate(-14 12 11)"/><path d="M11.2 15.6h1.4" transform="rotate(-14 12 11)"/><path d="M4.6 8.2c-.9 1.6-.9 3.6 0 5.2"/><path d="M2.4 6.8c-1.5 2.6-1.5 5.8 0 8.4"/><path d="M19.4 8.6c.9 1.6.9 3.6 0 5.2"/><path d="M21.6 7.2c1.5 2.6 1.5 5.8 0 8.4"/></svg>
  </button>
  <button id="rotateBtn" class="fab" aria-label="上下を入れ替える">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9"/><path d="M5.5 2.8v3.6h3.6"/><path d="M4 13a8 8 0 0 0 14.3 4.9"/><path d="M18.5 21.2v-3.6h-3.6"/></svg>
</button>
</div>
<button id="menuBtn" class="fab" aria-label="メニュー" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<div id="scrim" hidden></div>
<nav id="menu" aria-label="メニュー" inert>
  <div class="mlbl">モード</div>
  <div role="radiogroup" aria-label="モード" style="display:flex;flex-direction:column;gap:6px">
    <button class="mitem" role="radio" data-mode="heal" aria-checked="true"><span>癒しモード</span></button>
    <button class="mitem" role="radio" data-mode="timer" aria-checked="false"><span>タイマーモード</span></button>
  </div>
  <button class="mitem" data-mode="edit" aria-disabled="true"><span>編集モード</span><span class="soon">準備中</span></button>
  <button class="mitem" data-mode="maze" aria-disabled="true"><span>迷路モード</span><span class="soon">準備中</span></button>
  <button class="mitem" data-mode="shake" aria-disabled="true"><span>シェイクモード</span><span class="soon">準備中</span></button>
</nav>
<div id="fps"></div>
<div id="topProbe" style="position:fixed;left:0;top:0;width:0;height:var(--top-safe);visibility:hidden;pointer-events:none"></div>
<script>
(() => {
  'use strict';
  // =========================================================
  // 容器の形(ワールド座標, 単位 = 論理px)。docs/reference-notes.md 参照
  // =========================================================
  const W = 200, H = 420;
  const WAIST = 16;                         // ゆるいくびれ
  const CAP = 46, SIDE = 11;                // 上下ブロックと側面の厚み
  // 仕切りは上下同じ部品(ひっくり返した形): 容器とほぼ同じ幅のコップ。底はお皿のように丸くなめらかで、真ん中に穴
  const PLATE_Y = 36;                       // コップの壁が終わって、お皿の丸い底が始まる高さ
  const BOWL_R = 40, NECK = 16;             // お皿の丸みの深さ / 真ん中の穴に向かって細くなる首の深さ
  const PLATE_V = BOWL_R + NECK;            // お皿のふちから真ん中の穴までの深さ
  const HOLE = 11;                          // 中央の穴(ノズル)の半幅
  const GAP = 9;                            // コップの壁と容器の壁のすき間(滴よりずっと細い。上下とも開いている)
  const DEPTH = 10;                         // 厚い部屋(上下)の奥行きが、少し上から見たときに見える量
  const SKIRT_END = 12;                     // コップの縁(容器の端のすぐ近く。縁と端の間に少しだけすき間)
  function halfW(y) {
    const s = Math.sin(Math.PI * Math.min(1, Math.max(0, y / H)));
    return W / 2 - WAIST * s * s;
  }
  // 上の部屋: 液はコップの中にたまり、丸い底を伝って真ん中の穴へ集まる
  // 下の部屋: ふせたお皿(丸い山)に落ちた滴は斜面を滑って左右の端へ行き、壁との細いすき間を伝って下り、
  //   縁と端の間のすき間から容器のいちばん下にたまる。上下対称なので、ひっくり返すと役目が入れ替わる
  const SEG = [], SKIND = [];   // SKIND: 0=お皿の底 1=コップの壁 2=ノズルのふた
  const PLATE_HW = Math.min(halfW(PLATE_Y), halfW(SKIRT_END)) - GAP;   // コップの壁の位置
  // お皿の底の深さ。u: 0=真ん中の穴 1=ふち(壁)。ふちでは縦にまるく、穴の近くは首のように細くなる
  function bowlDepth(u) { return BOWL_R * Math.sqrt(Math.max(0, 1 - u * u)) + NECK * Math.pow(1 - u, 4); }
  {
    const cx = W / 2, hw = PLATE_HW, K = 10;
    for (const flip of [false, true]) {
      const f = y => flip ? H - y : y;
      for (const sx of [-1, 1]) {
        SEG.push([cx + sx * hw, f(SKIRT_END), cx + sx * hw, f(PLATE_Y)]); SKIND.push(1);   // コップの壁
        let px = cx + sx * hw, py = f(PLATE_Y);
        for (let k = 1; k <= K; k++) {                                                    // 丸い底(両端ほど細かく区切る)
          const u = 0.5 + 0.5 * Math.cos(Math.PI * k / K);
          const nx = cx + sx * (HOLE + u * (hw - HOLE)), ny = f(PLATE_Y + bowlDepth(u));
          SEG.push([px, py, nx, ny]); SKIND.push(0); px = nx; py = ny;
        }
      }
    }
  }
  // ノズルのふた(色ごとに通す/通さないを切り替える見えない板)
  //   上側の仕切りのノズル: 青とピンクを交互に1滴ずつ出す / 下側のノズル: いつでも通る
  const NPLATE = SEG.length;
  SEG.push([W / 2 - HOLE - 1, PLATE_Y + PLATE_V, W / 2 + HOLE + 1, PLATE_Y + PLATE_V]); SKIND.push(2);          // 0: 容器の上側の仕切りのノズル
  SEG.push([W / 2 - HOLE - 1, H - PLATE_Y - PLATE_V, W / 2 + HOLE + 1, H - PLATE_Y - PLATE_V]); SKIND.push(2);  // 1: 容器の下側の仕切りのノズル
  const NBASE = SEG.length;            // ここまでが容器と仕切り。ここから後ろは形ごとの飾り(段・水車・らせん)
  let NS = NBASE;
  const SCAP = NBASE + 200;
  const lidMask = new Uint8Array(2);   // ビット0=Aを止める ビット1=Bを止める
  const crossOK = [false, false];      // 色ごと: ノズルの上と下の液がつながってよいか(ぶら下がる滴をつくる間だけ)
  let DRIP_PERIOD = 2.4, DRIP_OPEN = 0.95;   // 秒(青とピンクは半周期ずらして交互に)。形によって変わる
  const SX = new Float32Array(SCAP), SY = new Float32Array(SCAP), SDX = new Float32Array(SCAP), SDY = new Float32Array(SCAP),
        SL2 = new Float32Array(SCAP), SNX = new Float32Array(SCAP), SNY = new Float32Array(SCAP);
  // 当たり判定の範囲(遠い板は調べない)と、板の厚み(底は液の見た目がはみ出さないよう少し厚め、壁は細いすき間を通れるよう薄め)
  const SBX0 = new Float32Array(SCAP), SBX1 = new Float32Array(SCAP), SBY0 = new Float32Array(SCAP), SBY1 = new Float32Array(SCAP);
  // 板の厚みは、コップの内側と外側で変える:
  //   内側(たまった液の側): 厚め。液の見た目が板の線からはみ出さないように
  //   外側の、細いすき間の入口のあたり: 薄め。滴がすき間へ入れるように
  const SMG = new Float32Array(SCAP), SMGO = new Float32Array(SCAP), SIN = new Int8Array(SCAP);
  SEG.forEach(([x1, y1, x2, y2], i) => {
    const nearEdge = Math.max(Math.abs(x1 - W / 2), Math.abs(x2 - W / 2)) > PLATE_HW - 10;
    if (SKIND[i] === 2) { SMG[i] = SMGO[i] = 2; }
    else {
      SMG[i] = SKIND[i] === 0 ? 5 : 4;
      SMGO[i] = SKIND[i] === 1 || nearEdge ? 1.2 : 5;
      // コップの内側を指す向き(コップの真ん中あたりの点が、板のどちら側にあるか)
      const top = (y1 + y2) / 2 < H / 2, ry = top ? (SKIRT_END + PLATE_Y) / 2 : H - (SKIRT_END + PLATE_Y) / 2;
      const l = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / l, ny = (x2 - x1) / l;
      SIN[i] = ((W / 2 - x1) * nx + (ry - y1) * ny) > 0 ? 1 : -1;
    }
    const e = Math.max(SMG[i], SMGO[i]) + 12;
    SBX0[i] = Math.min(x1, x2) - e; SBX1[i] = Math.max(x1, x2) + e; SBY0[i] = Math.min(y1, y2) - e; SBY1[i] = Math.max(y1, y2) + e;
    SX[i] = x1; SY[i] = y1; SDX[i] = x2 - x1; SDY[i] = y2 - y1;
    SL2[i] = SDX[i] * SDX[i] + SDY[i] * SDY[i];
    const l = Math.sqrt(SL2[i]); SNX[i] = -SDY[i] / l; SNY[i] = SDX[i] / l;
  });
  // 飾りの板を1本置く(両側とも同じ薄さ)
  function setSeg(i, x1, y1, x2, y2) {
    SMG[i] = SMGO[i] = 2.6; SIN[i] = 0;
    const e = 2.6 + 12;
    SBX0[i] = Math.min(x1, x2) - e; SBX1[i] = Math.max(x1, x2) + e; SBY0[i] = Math.min(y1, y2) - e; SBY1[i] = Math.max(y1, y2) + e;
    SX[i] = x1; SY[i] = y1; SDX[i] = x2 - x1; SDY[i] = y2 - y1;
    SL2[i] = SDX[i] * SDX[i] + SDY[i] * SDY[i] || 1e-6;
    const l = Math.sqrt(SL2[i]); SNX[i] = -SDY[i] / l; SNY[i] = SDX[i] / l;
  }

  // =========================================================
  // 季節の色。A=手前の液体 / B=奥の液体(それぞれ 明るい色 / 縁の濃い色)。css は背景の色
  // =========================================================
  const THEMES = [
    { name: '春 🌸', A: [[1.,.70,.80],[.84,.34,.52]],  B: [[1.,.90,.36],[.86,.66,.06]],  css: ['#fffafc','#fbe9f0','#ffd9e6','#fff3c4'] }, // 桜と菜の花
    { name: '夏 🌻', A: [[.10,.62,.92],[.0,.30,.66]],  B: [[1.,.82,.12],[.90,.52,.0]],   css: ['#f7fcff','#e3f2fb','#cdeefc','#fff1bd'] }, // 海とひまわり
    { name: '秋 🍁', A: [[.92,.30,.16],[.60,.08,.06]], B: [[.98,.74,.20],[.80,.42,.02]], css: ['#fffaf4','#f6e8dc','#ffd6bf','#ffecb8'] }, // もみじと銀杏
    { name: '冬 ❄️', A: [[.96,.98,1.],[.48,.58,.74]],  B: [[.68,.87,.98],[.26,.50,.74]], css: ['#e3ebf3','#b7c8da','#d2deeb','#a6bbd2'] }, // 雪と氷
  ];
  let theme = 0;

  // =========================================================
  // 物理(粒子法: double density relaxation)
  // 青は上の部屋から落ち、ピンクは下の部屋から昇る。どちらも真ん中の穴だけを通る。透明な液体は抵抗として扱う
  // =========================================================
  const R = 14, SP = 6.2, SUB = 2;
  const K = 0.24, KN = 0.45;                // 圧力・近距離圧力
  const ST = 0.03;                          // 表面張力(表面を縮めて丸い滴にする)
  const GRAV = [0.0105, 0.0095];           // どちらも透明な液体より重くて沈む。A(青)が少しだけ重い(写真では底に青の層)
  const DRAG = 0.972, VMAX = 3;   // 透明な液体の粘り気で、ゆっくり一定の速さで落ちる
  const DRAG_THIN = 0.945;        // 真ん中の薄いすき間では、壁にはさまれてさらにゆっくり
  const DRAG_ROLL = 0.988;
  const ROLL = new Uint8Array(1600);
  let rollFast = true;   // 階段では速く転がさない(小さな粒が段を飛びこえないように、段の上をゆっくり進む)
  const DRAG_CUP = 0.99;          // 厚い部屋の中はさらさら流れて、液面がすぐ平らになる
  const WANDER = 0.005;          // 薄いすき間の中のゆるやかな横の流れ(列がジグザグにゆらぐ)
  let simT = 0;
  const DSCALE = new Float32Array(1600).fill(1);   // 粒ごとの重さの個性(滴ごとに落ちる速さが少しずつ違う)
  const MAXN = 1600;
  const X = new Float32Array(MAXN), Y = new Float32Array(MAXN);
  const PX = new Float32Array(MAXN), PY = new Float32Array(MAXN);
  const VX = new Float32Array(MAXN), VY = new Float32Array(MAXN);
  const ROOM = new Uint8Array(MAXN);       // いる場所 0=上の部屋 1=真ん中 2=下の部屋(漏れ防止に使う)
  const T = new Uint8Array(MAXN);           // 0=A(青・沈む) 1=B(ピンク・昇る)
  let N = 0, rho0 = 1;

  const GW = Math.ceil(W / R) + 1, GH = Math.ceil(H / R) + 1;

      else if (SKIND[s] === 0) m = 1.2 + 3.8 * Math.min(1, Math.max(0, (PLATE_HW - 2 - Math.abs(qx - W / 2)) / 14));
      else m = SMGO[s];
      const dx = x - qx, dy = y - qy, d2 = dx * dx + dy * dy;
      if (s0 * s1 < 0 && t > 0 && t < 1) {
        // 通り抜け防止: 前の位置の側へ戻す
        const side = s0 > 0 ? 1 : -1;
        X[i] = qx + SNX[s] * m * side; Y[i] = qy + SNY[s] * m * side;
        HIT[i] = 1; HNX[i] = SNX[s] * side; HNY[i] = SNY[s] * side;
        if (s >= NBASE) ROLL[i] = 6;
      } else if (d2 < m * m) {
        const d = Math.sqrt(d2);
        let nx, ny;
        if (d < 1e-3) { const side = s0 >= 0 ? 1 : -1; nx = SNX[s] * side; ny = SNY[s] * side; }
        else { nx = dx / d; ny = dy / d; }
        X[i] = qx + nx * m; Y[i] = qy + ny * m;
        HIT[i] = 1; HNX[i] = nx; HNY[i] = ny;
        if (s >= NBASE) ROLL[i] = 6;
      }
    }
  }

  // ノズルが開いている間、ノズルの入り口付近の液体に少し下向きの力を足す
  // (ぶら下がった滴の重さが液を引っぱる効果の代わり。少量でも最後まで落ちきる)
  const nozY = [-1, -1];   // 色ごとの、開いているノズルの入り口(なければ -1)
  function substep() {
    for (let i = 0; i < N; i++) {
      let g = GRAV[T[i]] * DSCALE[i];
      const nz = nozY[T[i]];
      if (nz >= 0 && Math.abs(X[i] - W / 2) < HOLE + 6 && Math.abs(Y[i] - nz) < 18) g *= 4;
      if (inChanZone(X[i], Y[i]) || (ROOM[i] === 1 && mouthZone(X[i], Y[i]))) g *= 3;   // 細いすき間に入った液は、細い流れになってすっと下りていく
      // 薄いのは真ん中の落ちる部分だけ。仕切りの上に乗った液は、ふつうの速さで端へ流れる
      const yy = gby >= 0 ? Y[i] : H - Y[i];
      // 薄い所(コップの外側)では壁にはさまれてゆっくり。受け皿の山の上の液は、ふつうの速さで端へ流れる
      const thin = ROOM[i] === 1 && yy < H - PLATE_Y - PLATE_V - 40;
      // 段やカーブに乗っている滴は、すべるように転がっていく(段の上にたまらないように)
      const fastRoll = ROLL[i] && rollFast;
      const dr = fastRoll ? DRAG_ROLL : thin ? DRAG_THIN : ROOM[i] !== 1 ? DRAG_CUP : DRAG;
      if (fastRoll) g *= 2.2;
      // 薄いすき間の中では、ゆるやかな流れで滴の列が左右にゆらぐ(色ごとに奥行きが違うので流れも少し違う)
      let wx = 0;
      if (thin) { const ph = T[i] * 2.1;
        wx = WANDER * (Math.sin(Y[i] * 0.045 + simT * 0.35 + ph) + 0.6 * Math.sin(Y[i] * 0.11 - simT * 0.23 + ph * 2)); }
      const vx = (VX[i] + gbx * g + ax + wx) * dr, vy = (VY[i] + gby * g + ay) * dr;
      PX[i] = X[i]; PY[i] = Y[i];
      X[i] += vx; Y[i] += vy;
    }
    buildGrid();
    const sep = decoLines.length > 0 && decoOn;
    if (sep) computeSides();
    for (let i = 0; i < N; i++) {
      const xi = X[i], yi = Y[i], ti = T[i];
      const c = cellOf[i], cx = c % GW, cy = (c / GW) | 0;
      let rho = 0, rhoN = 0, n = 0, ws = 0, wx = 0, wy = 0;
      const inCup = ROOM[i] !== 1;
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        if (gy < 0 || gy >= GH) continue;
        for (let gx = cx - 1; gx <= cx + 1; gx++) {
          if (gx < 0 || gx >= GW) continue;
          const cc = gy * GW + gx;
          for (let k = cellStart[cc], e = cellStart[cc + 1]; k < e; k++) {
            const j = sorted[k];
            if (j === i) continue;
            const dx = X[j] - xi, dy = Y[j] - yi, d2 = dx * dx + dy * dy;
            if (d2 >= R2 || n >= 256) continue;
            // 青とピンクは表と裏の別の層にあるので、どこでもお互いにぶつからない(同じ色どうしだけ計算する)
            if (T[j] !== ti) continue;
            if (sep && ((SIDEM[i] ^ SIDEM[j]) & EXTM[i] & EXTM[j])) continue;
            // 仕切りの向こう側(別の部屋)の液とは引っぱり合わない: 出た滴が穴へ引き戻されない
            // ぶら下がる滴をつくっている間だけ、ノズルの上と下の液がつながる。切れたあとは引き戻されない
            if (ROOM[j] !== ROOM[i] && !(crossOK[ti] && Math.abs(xi - W / 2) < HOLE + 16)) continue;
            const q = Math.sqrt(d2) / R, a = 1 - q;
            rho += a * a; rhoN += a * a * a; ws += a; wx += a * X[j]; wy += a * Y[j];
            nbJ[n] = j; nbQ[n] = q; n++;
          }
        }
      }
      // 厚い部屋の中は引っぱり合い(表面張力)を弱めて、液面が平らに広がるようにする
      let pr = K * (rho - rho0);
      if (inCup && pr < 0) pr *= 0.4;
      const chanI = inChanZone(xi, yi) || (ROOM[i] === 1 && mouthZone(xi, yi));
      if (chanI && pr < 0) pr = 0;   // 細いすき間の中の流れは、上の液のかたまりに引き戻されない
      const prN = KN * rhoN;
      let sx = 0, sy = 0;
      for (let m = 0; m < n; m++) {
        const j = nbJ[m], q = nbQ[m], a = 1 - q;
        let dx = X[j] - X[i], dy = Y[j] - Y[i];
        const d = Math.sqrt(dx * dx + dy * dy) || 1e-4;
        dx /= d; dy /= d;
        const D = (pr * a + prN * a * a) * 0.5;
        X[j] += dx * D; Y[j] += dy * D;
        sx -= dx * D; sy -= dy * D;
      }
      X[i] += sx; Y[i] += sy;
      // 周りの同じ色の重心へ少し寄せる: 表面が縮み、細い流れはくびれて滴に分かれる
      const st = chanI ? 0 : inCup ? ST * 0.15 : ST;
      if (ws > 0) { X[i] += st * (wx / ws - xi); Y[i] += st * (wy / ws - yi); }
    }
    const m = 2.5;
    for (let i = 0; i < N; i++) {
      collidePlates(i);
      let x = X[i], y = Y[i];
      if (y < m) y = m; else if (y > H - m) y = H - m;
      const lim = halfW(y) - (Math.abs(x - W / 2) > PLATE_HW ? 1.2 : m);   // 細いすき間の中は壁ぎりぎりまで通れる
      if (x < W / 2 - lim) x = W / 2 - lim; else if (x > W / 2 + lim) x = W / 2 + lim;
      // すり抜け防止: 仕切りの板そのものを通り抜けて別の場所へ移っていたら、このステップの動きを取り消す
      // (穴やすき間を通るのは自由。通りやすさは仕切りの形と重さで自然に決まる)
      // 横のすき間(縦の仕切りと壁の間の細い通り道)の入口: 色の液が細いすき間へ入るには、
      // 透明な液との境目の膜(界面張力)を押し広げる必要がある。重さの差が小さいので、ふつうは入れない
      //   部屋の側からの入口: 強く押し返す(強く振る・大きく傾けたときだけ入れる)
      //   真ん中の側からの入口(山型の坂を滑り下りた先): 弱く押し返す
      if (inChan(x, y) && !inChan(PX[i], PY[i])) {
        const fromEnd = PY[i] < SKIRT_END + 4 || PY[i] > H - SKIRT_END - 4;
        if (!canEnterGap(i, fromEnd ? GAP_STRONG : GAP_WEAK)) {
          // 膜に押し返される: すき間へ入ろうとした向きの動きだけ止める(横へは動ける)
          if (inChan(PX[i], y)) y = PY[i];
          if (inChan(x, y)) x = PX[i];
          // 入口は滴よりずっと細いので、入口の上には乗れない。すぐ隣の広いコップの中へ転がり落ちる
          // (上側の端からすき間へ落ちようとしたときだけ。下側でたまった液が押し上げられたときは何もしない)
          const fromUpperEnd = gby >= 0 ? PY[i] < SKIRT_END + 4 : PY[i] > H - SKIRT_END - 4;
          if (fromUpperEnd) { x -= Math.sign(x - W / 2) * 1.0; y -= gby * 0.8; }   // 縁の上を越えて内側へ
        }
      }
      const r = roomOf(x, y);
      if (r !== ROOM[i]) {
        // 実際に開いているのは、真ん中の穴と、縦の仕切りの先(容器の端の近く)のすき間
        const viaHole = Math.abs(x - W / 2) < HOLE + 2 && Math.abs(PX[i] - W / 2) < HOLE + 2;
        const nearEnd = (yy) => yy < SKIRT_END + 8 || yy > H - SKIRT_END - 8;
        const viaSkirt = nearEnd(y) && nearEnd(PY[i]);
        if (viaHole || viaSkirt) ROOM[i] = r;
        else { x = PX[i]; y = PY[i]; }
      }
      X[i] = x; Y[i] = y;
      let vx = x - PX[i], vy = y - PY[i];
      if (HIT[i]) { const vn = vx * HNX[i] + vy * HNY[i]; vx -= vn * HNX[i]; vy -= vn * HNY[i]; }
      const v2 = vx * vx + vy * vy;
      // 穴の中ではゆっくり: 勢いよく噴き出さず、じわっと出て滴になる
      const inHole = Math.abs(x - W / 2) < HOLE + 4 &&
        (Math.abs(y - PLATE_Y - PLATE_V) < 16 || Math.abs(y - H + PLATE_Y + PLATE_V) < 16);
      const vmax = inHole ? 0.8 : VMAX;
      if (v2 > vmax * vmax) { const s = vmax / Math.sqrt(v2); vx *= s; vy *= s; }
      VX[i] = vx; VY[i] = vy;
    }
  }

  // 透明な液体の中の小さな泡(見た目だけ)
  const NB = 10, BX = new Float32Array(NB), BY = new Float32Array(NB), BV = new Float32Array(NB),
        BS = new Float32Array(NB), BP = new Float32Array(NB);
  const BLO = PLATE_Y + PLATE_V + 12, BHI = H - PLATE_Y - PLATE_V - 12;
  function initBubbles() {
    for (let i = 0; i < NB; i++) { BX[i] = 20 + Math.random() * (W - 40); BY[i] = BLO + Math.random() * (BHI - BLO);
      BV[i] = 0.05 + Math.random() * 0.08; BS[i] = 0.2 + Math.random() * 0.25; BP[i] = Math.random() * 6.28; }
  }
  let bt = 0;
  function moveBubbles() {
    bt += 1 / 60;
    for (let i = 0; i < NB; i++) {
      BY[i] += -gby * BV[i] + ay * SUB * 0.3; BX[i] += -gbx * BV[i] + Math.sin(bt * 0.8 + BP[i]) * 0.1 + ax * SUB * 0.3;
      if (BY[i] < BLO) BY[i] = BHI; else if (BY[i] > BHI) BY[i] = BLO;
      const lim = halfW(BY[i]) - 5;
      if (BX[i] < W / 2 - lim) BX[i] = W / 2 - lim; else if (BX[i] > W / 2 + lim) BX[i] = W / 2 + lim;
    }
  }

  // =========================================================
  // 描画(WebGL)
  //   1) 粒子をぼかした点として「濃度テクスチャ」に加算 (A=R, B=G, 泡=B)
  //   2) 濃度をしきい値で切って液体の形を作り、色・縁の線・ツヤを付ける
  // =========================================================
  const glCv = document.getElementById('gl');
  const gl = glCv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }

  const splatP = prog(`
    attribute vec3 a; uniform vec2 uSize; uniform float uPt; varying float vT; varying float vTm;
    // 薄い所かどうか(1=薄い 0=厚い)。厚いのは上下のコップの内側と、容器の端のあたりだけ。コップの外側はすべて薄い
    uniform vec4 uPlate;    // コップの壁が終わる高さ, お皿の丸みの深さ, 首の深さ, 穴の半幅
    uniform vec2 uPlate2;   // コップの壁の位置(真ん中から), 縁の高さ
    float plateTopAt(float d){
      if (d <= uPlate.w) return uPlate.x + uPlate.y + uPlate.z;
      float u = min(1., (d - uPlate.w) / (uPlate2.x - uPlate.w));
      return uPlate.x + uPlate.y * sqrt(max(0., 1. - u*u)) + uPlate.z * pow(1. - u, 4.);
    }
    float thinAt(vec2 p){
      float d = abs(p.x - uSize.x*.5);
      float endT = smoothstep(uPlate2.y - 2., uPlate2.y + 6., p.y) * (1. - smoothstep(uSize.y - uPlate2.y - 6., uSize.y - uPlate2.y + 2., p.y));
      if (d >= uPlate2.x) return endT;
      float pt = plateTopAt(d);
      return smoothstep(pt - 2., pt + 6., p.y) * (1. - smoothstep(uSize.y - pt - 6., uSize.y - pt + 2., p.y));
    }
    void main(){ vT = a.z; gl_Position = vec4(a.x/uSize.x*2.-1., 1.-a.y/uSize.y*2., 0., 1.);
      // 薄い所では、滴が前後の壁に押されて平たく広がり、正面からは大きな丸に見える
      float tm = vT < 1.5 ? thinAt(a.xy) : 0.;
      vTm = tm;
      gl_PointSize = uPt * (1. + .3 * tm); }`,
  `precision mediump float; varying float vT; varying float vTm;
    void main(){ vec2 p = gl_PointCoord*2.-1.;
      p.y *= mix(1., 1.12, vTm);   // 押しつぶされた滴は少し横長の楕円に
      float r2 = dot(p,p); if(r2>1.) discard;
      float v = 1.-r2; v = v*v*v*0.44;   // 1粒だけ(しぶき)はしきい値に届かず見えない。滴になると見える
      gl_FragColor = vT < .5 ? vec4(v,0.,0.,0.) : vT < 1.5 ? vec4(0.,v,0.,0.) : vec4(0.,0.,v*1.9,0.); }`);

  const compP = prog(`
    attribute vec2 a; varying vec2 vUv;
    void main(){ vUv = a*.5+.5; gl_Position = vec4(a,0.,1.); }`,
  `precision mediump float;
    varying vec2 vUv; uniform sampler2D uF; uniform vec2 uTx; uniform vec2 uSize; uniform float uWaist;
    uniform vec3 uA0, uA1, uB0, uB1;   // 各色の 明るい色 / 濃い色
    // 薄い所かどうか(1=薄い 0=厚い)。形は変わらないので、前もって作った画像から読む(軽くするため)
    uniform sampler2D uThin;
    uniform float uDepth;              // 厚い部屋の奥行き(少し上から見たときに見える上面の高さ)
    float thinAt(vec2 p){ return texture2D(uThin, vec2(p.x / uSize.x, 1. - p.y / uSize.y)).r; }
    float halfW(float y){ float s = sin(3.14159265*clamp(y/uSize.y,0.,1.)); return uSize.x*.5 - uWaist*s*s; }
    void main(){
      vec2 w = vec2(vUv.x*uSize.x, (1.-vUv.y)*uSize.y);
      if(halfW(w.y) - abs(w.x-uSize.x*.5) < 0.) discard;
      vec4 c = texture2D(uF, vUv);
      const float TH = .5;
      float ab = smoothstep(TH-.05, TH+.05, c.r);
      float ap = smoothstep(TH-.05, TH+.05, c.g);
      float ao = smoothstep(.42, .58, c.b);
      // 厚い部屋の液は奥行きのある塊: 少し上から見ているので、手前の面の上に「液の上面」が見える。
      // 下に向かって奥行きぶん調べ、その位置の液(厚い部屋の液だけ)の上面がここに見えるかを求める
      float topD = 0., hitK = 9., mA = 0., mB = 0.;
      // 液の手前の面が何px下にあるかを、となりの2点の間で補間して求める(段々のすじが出ないように)
      float prevD = max(c.r, c.g) * (1. - thinAt(w));
      // 上下の部屋のまわりで、手前の面に隠れていない所だけ調べる(真ん中ではすぐ終わるので軽い)
      float front0 = max(ab, ap);
      bool zone = thinAt(w) < .99 || thinAt(w + vec2(0., uDepth)) < .99;
      if (!zone && max(front0, ao) < .003) discard;
      if (zone && front0 < .99 && max(texture2D(uF, vUv - vec2(0., uDepth * .5 / uSize.y)).r + texture2D(uF, vUv - vec2(0., uDepth * .5 / uSize.y)).g,
                                    texture2D(uF, vUv - vec2(0., uDepth / uSize.y)).r + texture2D(uF, vUv - vec2(0., uDepth / uSize.y)).g) > .2)
      for (int k = 1; k <= 6; k++) {
        float sd = float(k) / 6. * uDepth, ys = w.y + sd;
        float thick = 1. - thinAt(vec2(w.x, ys));
        vec4 cs = texture2D(uF, vUv - vec2(0., sd / uSize.y));
        float d = max(cs.r, cs.g) * thick;
        if (d > TH && hitK > 8.) hitK = float(k) - 1. + clamp((TH - prevD) / max(d - prevD, 1e-3), 0., 1.);
        prevD = d;
        mA = max(mA, cs.r * thick); mB = max(mB, cs.g * thick);
        topD = max(topD, d);
      }
      float front = max(ab, ap);
      float uTop = smoothstep(TH - .05, TH + .05, topD) * (1. - front);
      if(max(max(front, ao), uTop) < .003) discard;
      vec4 tl = texture2D(uF, vUv-vec2(uTx.x,0.)), tr = texture2D(uF, vUv+vec2(uTx.x,0.));
      vec4 td = texture2D(uF, vUv-vec2(0.,uTx.y)), tu = texture2D(uF, vUv+vec2(0.,uTx.y));
      vec3 na = normalize(vec3((tl.r-tr.r)*2.4, (td.r-tu.r)*2.4, 1.));
      vec3 nb = normalize(vec3((tl.g-tr.g)*2.4, (td.g-tu.g)*2.4, 1.));
      vec3 no = normalize(vec3((tl.b-tr.b)*1.5, (td.b-tu.b)*1.5, 1.));
      // 縁の細い線(しきい値のすぐ内側)
      float la = ab * (1. - smoothstep(TH+.03, TH+.14, c.r));
      float lb = ap * (1. - smoothstep(TH+.03, TH+.14, c.g));
      // 真ん中(薄いすき間)かどうか
      float tm = thinAt(w);
      // 厚い部屋: 液が厚いぶん深く濃い色。縁ほどさらに濃く、中は光が通って少し明るい(立体感)
      float da = smoothstep(TH, .98, c.r), db = smoothstep(TH, .98, c.g);
      // 上を向いた縁(上面へつながる所)は暗くしない: 手前の面と上面がつなぎ目なくなじむ
      float upA = smoothstep(.1, .5, na.y), upB = smoothstep(.1, .5, nb.y);
      float ea = clamp(.62 + ((1.-na.z)*.9 + la*.3) * (1. - .85*upA) - da*.15, 0., 1.);
      float eb = clamp(.62 + ((1.-nb.z)*.9 + lb*.3) * (1. - .85*upB) - db*.15, 0., 1.);
      // 薄いすき間: 押しつぶされた円盤はほぼ均一な明るい色に、細い縁取り
      ea = mix(ea, clamp(.06 + la*.85, 0., 1.), tm);
      eb = mix(eb, clamp(.06 + lb*.85, 0., 1.), tm);
      vec3 colA = mix(uA0, uA1, ea), colB = mix(uB0, uB1, eb);
      // 色の重なり: 半透明の色フィルムを重ねたように掛け合わせる(青×ピンク → 濃紺)
      vec3 col = mix(vec3(1.), colB, ap*.96) * mix(vec3(1.), colA, ab*.96);
      col *= mix(1., .88, ab*ap);
      // ツヤ: 厚い部屋は強くはっきり、薄い円盤は縁に小さく
      vec3 L = normalize(vec3(-.55,.6,.58)), Hh = normalize(L+vec3(0.,0.,1.));
      float sa = pow(max(dot(na,Hh),0.), 60.)*ab, sb = pow(max(dot(nb,Hh),0.), 60.)*ap;
      float soft = (pow(max(dot(na,Hh),0.), 10.)*ab + pow(max(dot(nb,Hh),0.), 10.)*ap) * (1.-tm) * .18;
      float bubbleRim = ao * smoothstep(.0, .5, 1.-no.z);
      float bubbleSpec = ao * pow(max(dot(no,Hh),0.), 30.);
      col = mix(col, vec3(1.), bubbleRim*.55) + bubbleSpec + (sa+sb)*mix(1., .55, tm) + soft;
      // 手前の面の上の縁: 上面との角が光を受けて明るく光る
      float alpha = max(max(ab*mix(.97,.9,tm), ap*mix(.96,.88,tm)), ao*(.15 + .6*bubbleRim + bubbleSpec));

      if (uTop > .003) {

  const rotateBtn = document.getElementById('rotateBtn'), rotateIcon = rotateBtn.querySelector('svg');
  let rotTurns = 0;
  rotateBtn.addEventListener('click', () => { flip(); rotTurns++; rotateIcon.style.transform = `rotate(${rotTurns * 180}deg)`; });
  // 右上に縦に並んだ季節のアイコン
  const seasonsEl = document.getElementById('seasons');
  const seasonBtns = THEMES.map((th, k) => {
    const label = th.name.split(' ')[0], file = ['spring', 'summer', 'autumn', 'winter'][k];
    const bt = document.createElement('button');
    bt.className = 'fab'; bt.setAttribute('role', 'radio'); bt.setAttribute('aria-label', label);
    const img = document.createElement('img'); img.src = `icons/${file}.png`; img.alt = ''; bt.appendChild(img);
    bt.addEventListener('click', () => applyTheme(k));
    seasonsEl.appendChild(bt); return bt;
  });
  function applyTheme(i) {
    theme = i;
    const [b1, b2, g1, g2] = THEMES[theme].css, st = document.documentElement.style;
    st.setProperty('--bg1', b1); st.setProperty('--bg2', b2); st.setProperty('--glow1', g1); st.setProperty('--glow2', g2);
    seasonBtns.forEach((bt, k) => bt.setAttribute('aria-checked', k === theme ? 'true' : 'false'));
    document.querySelectorAll('.bgimg').forEach((el, k) => el.classList.toggle('on', k === theme));
    drawGlass(scale, dpr);
  }

  // 左下の三本線で開け閉めするメニュー
  const menuBtn = document.getElementById('menuBtn'), menuEl = document.getElementById('menu'), scrim = document.getElementById('scrim');
  function setMenu(open) {
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuEl.classList.toggle('open', open); menuEl.inert = !open;
    if (open) { scrim.hidden = false; requestAnimationFrame(() => scrim.classList.add('open')); }
    else { scrim.classList.remove('open'); setTimeout(() => { if (!menuEl.classList.contains('open')) scrim.hidden = true; }, 280); }
  }
  menuBtn.addEventListener('click', () => setMenu(menuBtn.getAttribute('aria-expanded') !== 'true'));
  scrim.addEventListener('pointerdown', () => setMenu(false));
  addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  // モードの切り替え(癒し / タイマー)と、タイマーの形
  const modeBtns = [...document.querySelectorAll('[data-mode]')];
  // タイマーモードの時間ボタン(右下に縦に並ぶ。押すとその形で最初から)
  const timeBtnsEl = document.getElementById('timeBtns');
  const shapeBtns = SHAPES.map((sh, k) => {
    const bt = document.createElement('button');
    bt.className = 'fab'; bt.setAttribute('role', 'radio'); bt.setAttribute('aria-label', `約${sh.min}分(${sh.label})`);
    bt.innerHTML = `<b>${sh.min}</b><small>分</small>`;
    bt.addEventListener('click', () => { shapeIdx = k; setMode('timer'); });
    timeBtnsEl.appendChild(bt); return bt;
  });
  function setMode(m) {
    unlockAudio();
    mode = m;
    modeBtns.forEach(b => { if (b.getAttribute('role') === 'radio') b.setAttribute('aria-checked', b.dataset.mode === m ? 'true' : 'false'); });
    shapeBtns.forEach((b, k) => b.setAttribute('aria-checked', m === 'timer' && k === shapeIdx ? 'true' : 'false'));
    // タイマーモード: 右下は時間ボタンだけ(∞・センサー・回転は出さない)
    const tm = m === 'timer';
    timeBtnsEl.hidden = !tm;
    infinite = false; infBtn.setAttribute('aria-pressed', 'false');
    infBtn.style.display = tm ? 'none' : '';
    rotateBtn.style.display = tm ? 'none' : '';
    sBtn.style.display = tm || !sensorAvail ? 'none' : 'flex';
    if (tm && sensorOn) setSensor(false);
    restart();
  }
  modeBtns.forEach(b => b.addEventListener('click', () => {
    if (b.getAttribute('aria-disabled') === 'true') return;   // 編集・迷路・シェイクモード(中身はあとで作る)
    setMode(b.dataset.mode); setMenu(false);
  }));
  // 最初から(いまの向きで、上の部屋にたっぷり入れ直す)
  function restart() {
    const per = mode === 'timer' ? (SHAPES[shapeIdx].period || 2.4) : 2.4;
    DRIP_PERIOD = per; DRIP_OPEN = per * 0.4;
    rollFast = !(mode === 'timer' && SHAPES[shapeIdx].id === 'stairs');
    layoutFlip = gby < 0;
    init();
    buildDeco();
    timerStart = simT; timerDone = false;
  }

  // モーションセンサー(iPhoneはボタンを押して許可が必要)
  const sBtn = document.getElementById('sensorBtn');
  let sax = 0, say = 0, gsx = 0, gsy = 1, sensorOn = false;
  const sensorAvail = 'DeviceMotionEvent' in window && matchMedia('(pointer: coarse)').matches;   // スマホのときだけ
  if (sensorAvail) sBtn.style.display = 'flex';
  function onMotion(e) {
    const a = e.acceleration, g = e.accelerationIncludingGravity;
    if (a && a.x != null) { sax = a.x; say = -a.y; }
    if (g && g.x != null) {          // 端末の傾き = 重力の向き
      const x = -(g.x - (a ? a.x : 0)), y = (g.y - (a ? a.y : 0));
      const l = Math.hypot(x, y);
      if (l > 2) { gsx += (x / l - gsx) * 0.2; gsy += (-y / l - gsy) * 0.2; }
    }
  }
  function setSensor(on) {
    sensorOn = on;
    sBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    if (on) addEventListener('devicemotion', onMotion);
    else {
      removeEventListener('devicemotion', onMotion);
      sax = say = 0; gsx = 0; gsy = 1;   // 重力をまっすぐ下に戻す
    }
  }
  // タップするたびに ON / OFF を切り替える(iPhoneは最初の ON のときだけ許可を聞かれる)
  sBtn.addEventListener('click', async () => {
    if (sensorOn) { setSensor(false); return; }
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function' &&
          (await DeviceMotionEvent.requestPermission()) !== 'granted') return;
      setSensor(true);
    } catch (_) {}
  });

  // =========================================================
  // メインループ(物理は60Hz固定、描画は端末のリフレッシュレート)
  // =========================================================
  const fpsEl = document.getElementById('fps');
  const DROP_N = 16, dropDone = [false, false], dropSize = [16, 16];
  let dripT = 0, last = performance.now(), acc = 0, pvx = 0, pvy = 0, fpsT = 0, fpsN = 0, simMs = 0;
  function tick() {
    if (!dragging) { tx = homeX; ty = homeY; }
    const k = dragging ? 0.55 : 0.12;
    bvx = (tx - bx) * k; bvy = (ty - by) * k;
    bx += bvx; by += bvy;
    // 回転はばねでゆっくり
    angV += (angT - ang) * 0.012; angV *= 0.86; ang += angV;
    const co = Math.cos(ang), si = Math.sin(ang);
    // 画面の向き → 容器の向き
    gbx = gsx * co + gsy * si; gby = -gsx * si + gsy * co;
    const sx = (bvx - pvx) / scale + sax * 0.3, sy = (bvy - pvy) / scale + say * 0.3;
    let fx = sx * co + sy * si, fy = -sx * si + sy * co;
    pvx = bvx; pvy = bvy;
    const lim = 16;
    fx = Math.max(-lim, Math.min(lim, fx)); fy = Math.max(-lim, Math.min(lim, fy));
    ax = -fx * 0.5 / SUB; ay = -fy * 0.5 / SUB;
    // 上側の仕切りのノズルから、青とピンクを半拍ずらして1滴ずつ出す
    // 開いている間に液がじわっと出て、ノズルの先に涙形にぶら下がり、滴ひとつ分になったら切れて落ちる
    dripT += 1 / 60;
    const f = gby > 0.3 ? 0 : gby < -0.3 ? 1 : -1;   // いま上側にある仕切り(0=容器の上側 1=下側)
    // ピンクは量が青の半分ほどなので、2回に1回だけ出す(最後まで交互に落ちるように)
    const phaseA = dripT % DRIP_PERIOD, phaseB = (dripT + DRIP_PERIOD / 2) % (DRIP_PERIOD * 2);
    // 滴の大きさは毎回ばらばら(写真の実物と同じく大小が混ざる)
    const dsc = mode === 'timer' ? (SHAPES[shapeIdx].drop || 1) : 1;
    if (phaseA < 1 / 60) { dropDone[0] = false; dropSize[0] = Math.max(4, DROP_N * dsc * (0.6 + Math.random() * 0.9)); }
    if (phaseB < 1 / 60) { dropDone[1] = false; dropSize[1] = Math.max(4, DROP_N * dsc * (0.6 + Math.random() * 0.9)); }
    simT += 1 / 60;
    if (f < 0) { lidMask.fill(3); nozY[0] = nozY[1] = -1; crossOK[0] = crossOK[1] = false; }   // 回転の途中は全部閉じる
    else {
      const gs = f ? -1 : 1;                                     // 容器から見た「下」の向き
      const yU = f ? H - PLATE_Y - PLATE_V : PLATE_Y + PLATE_V;  // 上側の仕切りのノズル
      const cnt = [0, 0];
      for (let i = 0; i < N; i++) {
        if (Math.abs(X[i] - W / 2) > HOLE + 14) continue;
        const d = (Y[i] - yU) * gs; if (d > 0 && d < 30) cnt[T[i]]++;
      }
      if (cnt[0] >= dropSize[0]) dropDone[0] = true;
      if (cnt[1] >= dropSize[1]) dropDone[1] = true;
      const openA = phaseA < DRIP_OPEN && !dropDone[0];
      const openB = phaseB < DRIP_OPEN && !dropDone[1];
      lidMask[f] = (openA ? 0 : 1) | (openB ? 0 : 2);   // 上側のノズル: それぞれの番のときだけ
      lidMask[1 - f] = 0;                               // 下側のノズル: いつでも通る
      crossOK[0] = openA; crossOK[1] = openB;
      nozY[0] = openA ? yU - 8 * gs : -1;
      nozY[1] = openB ? yU - 8 * gs : -1;
    }
    // ひっくり返し終わったら、飾りを新しい向きで置き直し、タイマーなら最初から数える
    if (flipPending && Math.abs(angT - ang) < 0.03 && Math.abs(angV) < 0.003) {
      flipPending = false; layoutFlip = gby < 0; decoOn = true; buildDeco();
      decoCv.classList.remove('off'); wheelCv.classList.remove('off');
      if (mode === 'timer') { timerStart = simT; timerDone = false; }
    }
    if (decoOn && mode === 'timer' && SHAPES[shapeIdx].id === 'wheel') stepWheel();
    if (mode === 'timer' && !flipPending) {
      const sh = SHAPES[shapeIdx], el = simT - timerStart;
      // 下にたまる量を、時間に合わせて少しずつ増やす(ずっとモードと同じく、多く届いたぶんは下のいちばん底から上へ戻す)
      //   設定した時間でちょうど全部が下にたまる。下があふれることはない
      //   上の量を時間どおりに減らす(早く減りすぎたら、下のいちばん底から戻す)。lag は滴が真ん中を通る時間ぶんの前倒し
      const prog = Math.min(1, el / (sh.min * 60 - (sh.lag || 0)));
      keepTop(t => Math.ceil(topTarget[t] * (1 - prog)));
      if (!timerDone) {
        let top = 0, mid = 0; const rel = gby > 0 ? 0 : 2;
        for (let i = 0; i < N; i++) { if (ROOM[i] === rel) top++; else if (ROOM[i] === 1) mid++; }
        // 上が空になり、真ん中も(ほぼ)空になったら終わり。少しだけ引っかかって残った液は待たない
        // (止まって動かない液が少し残っても待たない: 真ん中の液がどれも 3 秒間ほとんど動かなければ終わり)
        let moving = false;
        for (let i = 0; i < N && !moving; i++) if (ROOM[i] === 1 && VX[i] * VX[i] + VY[i] * VY[i] > 0.0025) moving = true;
        if (moving || top > 0) midSince = el;
        // (水車に乗ったまま回り続ける液は待たない。決めた時間を大きく過ぎたら終わりにする)
        if (top === 0 && (mid <= 4 || el - midSince > 3 || el > sh.min * 60 + 8)) { timerDone = true; lastDoneAt = el; chime(); }
      }
    }
    for (let s = 0; s < SUB; s++) substep();
    if (infinite) recycle();
    moveBubbles();
  }
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    acc += dt;
    const t0 = performance.now();
    let n = 0;
    while (acc >= 1 / 60 && n < 3) { tick(); acc -= 1 / 60; n++; }
    if (n === 3) acc = 0;
    simMs = simMs * 0.9 + (performance.now() - t0) * 0.1;
    const tilt = Math.max(-0.2, Math.min(0.2, bvx * 0.008));
    bottleEl.style.transform = `translate3d(${bx}px,${by}px,0) rotate(${ang + tilt}rad)`;
    if (wheelCv.style.display !== 'none') wheelCv.style.transform = `rotate(${wheelAng}rad)`;
    shadowEl.style.transform = `translate3d(${bx - OW * scale * 0.15}px,${homeY + OH * scale - 10 * scale}px,0)`;
    render();
    fpsN++; fpsT += dt;
    if (fpsT > 1) { fpsEl.textContent = `${Math.round(fpsN / fpsT)}fps · 物理 ${simMs.toFixed(1)}ms · ${N}粒`; fpsN = 0; fpsT = 0; }
    requestAnimationFrame(loop);
  }

  let lastDoneAt = -1;
  resize(); init(); buildDeco(); applyTheme(0);
  window.__shake = { get infinite() { return infinite; }, get timer() { return { mode, shapeIdx, el: simT - timerStart, done: timerDone, lastDoneAt }; },
    setShape(k) { shapeIdx = k; setMode('timer'); }, setMode, N: () => N, X, Y, T, ROOM, roomOf, tick, flip, THEMES, applyTheme, setTilt(x, y) { gsx = x; gsy = y; } };
  requestAnimationFrame(loop);
})();
</script>
